run_name: clean_meta_learning_feature_ablation_v1
stage: clean_meta_learning_feature_ablation_v1

clean_inputs_required: true
feature_scope: fold_aware_train_only
meta_inputs_path: artifacts/meta_modeling/clean_fold_aware_inputs_v1/clean_fold_aware_meta_inputs.parquet
metrics_path: artifacts/forecasting/forecasting_benchmark_v2_clean_batched/metrics_long.parquet
features_path: artifacts/features/fold_aware_features_v2_clean_batched/final_train_only_features_by_fold.parquet
expected_observations: 3762
expected_feature_count: 25
expected_model_count: 11
expected_n_folds: 3

horizons: [1, 5, 20]
metrics: [rmse, directional_accuracy]
target_metrics: [rmse, directional_accuracy]

methods: [classification]
classification_models:
  - logistic_regression
  - random_forest_classifier
  - catboost_classifier

model_overrides:
  logistic_regression:
    C: 1.0
    max_iter: 1000
  random_forest_classifier:
    n_estimators: 200
    max_depth: 8
    min_samples_leaf: 3
    n_jobs: -1
  catboost_classifier:
    iterations: 300
    depth: 5
    learning_rate: 0.05
    l2_leaf_reg: 3.0
    random_seed: 42
    verbose: false

feature_sets: [full_25, standard, without_phase_space, nonlinear_only]
feature_set_definitions:
  full_25:
    - hurst_rs
    - hurst_dfa
    - acf_lag_2
    - acf_lag_5
    - acf_lag_10
    - acf_lag_25
    - acf_lag_50
    - acf_lag_100
    - abs_acf_lag_2
    - abs_acf_lag_5
    - abs_acf_lag_10
    - abs_acf_lag_25
    - abs_acf_lag_50
    - vr_q10
    - lb_ret_stat_50
    - lz_complexity
    - permutation_entropy
    - spectral_flatness
    - kurtosis
    - robust_kurtosis
    - tail_ratio_upper
    - hill_tail_index
    - correlation_dimension
    - embedding_dimension
    - selected_delay_tau
  standard:
    - hurst_rs
    - hurst_dfa
    - acf_lag_2
    - acf_lag_5
    - acf_lag_10
    - acf_lag_25
    - acf_lag_50
    - acf_lag_100
    - abs_acf_lag_2
    - abs_acf_lag_5
    - abs_acf_lag_10
    - abs_acf_lag_25
    - abs_acf_lag_50
    - vr_q10
    - lb_ret_stat_50
    - kurtosis
    - robust_kurtosis
    - tail_ratio_upper
    - hill_tail_index
  without_phase_space:
    - hurst_rs
    - hurst_dfa
    - acf_lag_2
    - acf_lag_5
    - acf_lag_10
    - acf_lag_25
    - acf_lag_50
    - acf_lag_100
    - abs_acf_lag_2
    - abs_acf_lag_5
    - abs_acf_lag_10
    - abs_acf_lag_25
    - abs_acf_lag_50
    - vr_q10
    - lb_ret_stat_50
    - lz_complexity
    - permutation_entropy
    - spectral_flatness
    - kurtosis
    - robust_kurtosis
    - tail_ratio_upper
    - hill_tail_index
  nonlinear_only:
    - lz_complexity
    - permutation_entropy
    - spectral_flatness
    - correlation_dimension
    - embedding_dimension
    - selected_delay_tau

candidate_selection:
  top_k_values: [3, 4, 5, 6]
  closeness_tolerance: 0.05

balancing_modes: [default, balanced]
decision_rules: [top_1, confidence_fallback]
confidence_thresholds: [0.50, 0.60, 0.70, 0.80]

random_seed: 42
n_repeats: 5
split:
  test_size: 0.2
  validation_size: 0.1
  random_seed: 42
  n_repeats: 5
  random_seeds: []

auto_select_latest_forecasting: false
output_dir: artifacts/meta_modeling/clean_meta_learning_feature_ablation_v1
